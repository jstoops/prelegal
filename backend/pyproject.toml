[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API, also serving the static frontend"
authors = [
    { name = "John Stoops", email = "1018106+jstoops@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prelegal-backend = "prelegal_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
